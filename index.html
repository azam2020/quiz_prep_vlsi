<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VLSI & Silicon Engineering Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; background: #f4f7f6; }
        .quiz-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .option { display: block; background: #e9ecef; margin: 10px 0; padding: 10px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc;}
        .option:hover { background: #d3d9df; }
        .correct { background: #d4edda; border-color: #c3e6cb; }
        .wrong { background: #f8d7da; border-color: #f5c6cb; }
        .explanation { display: none; margin-top: 15px; padding: 15px; background: #e2e3e5; border-left: 4px solid #6c757d; }
        #next-btn { margin-top: 20px; padding: 10px 20px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2 id="topic-title">Select a Topic</h2>
    <div id="question-text">Loading question...</div>
    <div id="options-container"></div>
    <div id="explanation" class="explanation"></div>
    <button id="next-btn" onclick="nextQuestion()">Next Question</button>
</div>

<!-- This is where we will link your generated questions -->
<script src="questions.js"></script>
<script>
    let currentQ = 0;
    
    // We will load the 'digital_electronics' array from questions.js
    const quizData = questionsData["digital_electronics"]; 

    function loadQuestion() {
        const q = quizData[currentQ];
        document.getElementById('question-text').innerText = (currentQ + 1) + ". " + q.question;
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, q.correct_index, btn, q.explanation);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, correctIndex, btn, explanation) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.style.pointerEvents = 'none'); // disable clicking again
        
        if (selectedIndex === correctIndex) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            options[correctIndex].classList.add('correct');
        }
        
        document.getElementById('explanation').innerText = "Explanation: " + explanation;
        document.getElementById('explanation').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById('question-text').innerText = "Quiz Completed!";
            document.getElementById('options-container').innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
        }
    }

    window.onload = loadQuestion;
</script>
</body>
</html>
